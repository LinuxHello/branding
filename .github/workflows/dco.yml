name: DCO

# Every commit of a pull request carries Signed-off-by (CONTRIBUTING.md).
# The job id equals the required check name in the ruleset for main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c ($(git log -1 --format=%an "$c")) is not signed off. Own commits: git commit -s. Bot commits: the maintainer certifies them with dco-signoff.sh <pr>."
              missing=1
            fi
          done
          exit "$missing"
